{% extends "layout.html" %}

{% block content %}
<main class="admin-login-shell">
    <form class="admin-login-card" method="POST">
        <p class="eyebrow">Private Editor</p>
        <h1>Reset Password</h1>
        <label>New password<input name="password" type="password" required autofocus></label>
        <label>Confirm password<input name="confirm_password" type="password" required></label>
        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}
        {% if notice %}
        <p class="form-notice">{{ notice }}</p>
        {% endif %}
        {% if token %}
        <button class="button primary" type="submit">Update Password</button>
        {% endif %}
        <a class="button ghost" href="{{ url_for('admin_login') }}">Back to Login</a>
    </form>
</main>
{% endblock %}
