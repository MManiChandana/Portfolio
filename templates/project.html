{% extends "layout.html" %}

{% block title %}Project Details{% endblock %}

{% block content %}

<div class="project-detail">

    <h1>{{ project.title }}</h1>

    <img src="/{{ project.image }}">

    <p>{{ project.description }}</p>

    <span>{{ project.tech }}</span>

    <video controls>
        <source src="/{{ project.video }}" type="video/mp4">
    </video>

</div>

{% endblock %}
